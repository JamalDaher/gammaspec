[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "gammaspec"
version = "0.1.0"
description = "Educational gamma-ray spectroscopy simulation and analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "plotly>=5.18", "streamlit>=1.30"]
[project.optional-dependencies]
dev = ["pytest>=7.4"]
[tool.setuptools.packages.find]
where = ["src"]
